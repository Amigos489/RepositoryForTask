version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: balabol
      POSTGRES_DB: book-store-hibernate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: tomcat_app
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  postgres_data: